services:
  mongo:
    image: mongo:7
    container_name: msoft-pda-mongo
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: usuarios_db
    volumes:
      - mongo_stress_data:/data/db
    cpus: "0.25"
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: msoft-pda-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_stress_data:
