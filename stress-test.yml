config:
  target: "http://localhost:3001"
  http:
    timeout: 1.5
  plugins:
    ensure: {}
  phases:
    - duration: 15
      arrivalRate: 25
      name: "1. Fase de Calentamiento (Tráfico Base)"
    - duration: 40
      arrivalRate: 50
      rampTo: 150
      name: "2. Fase de Saturación Máxima (Pico de Carga)"
  ensure:
    thresholds:
      - "http.response_time.p99": 200
    maxErrorRate: 1

scenarios:
  - name: "Martillo Mongo (escrituras válidas repetidas)"
    weight: 60
    flow:
      - loop:
          - post:
              url: "/api/empleados"
              json:
                nombre: "Andrés Mendoza"
                cargo: "Software Architect"
                departamento: "I+D"
                sueldo: 4200
              expect:
                - statusCode: 201
        count: 10

  - name: "Inundación perimetral (Payloads Mixtos Zod)"
    weight: 40
    flow:
      - post:
          url: "/api/empleados"
          json:
            nombre: "Andrés Mendoza"
            cargo: "Software Architect"
            departamento: "I+D"
            sueldo: 4200
          expect:
            - statusCode: 201
      - post:
          url: "/api/empleados"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500
          expect:
            - statusCode: 400
